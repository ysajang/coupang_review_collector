<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쿠팡 리뷰 수집기</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <img src="coupang_logo.png" alt="쿠팡 로고" class="logo">
            <h1>쿠팡 리뷰 수집기</h1>
            <p>상품 페이지에서 리뷰를 수집합니다</p>
        </div>

        <div class="stats">
            <div class="stats-label">수집된 리뷰</div>
            <div class="stats-count" id="count">0</div>
        </div>

        <div class="preview-section" id="previewSection">
            <div class="preview-header">
                <h3>최근 리뷰 미리보기</h3>
                <button class="toggle-btn" id="togglePreview">접기</button>
            </div>
            <div class="preview-list" id="previewList"></div>
        </div>

        <div class="button-container">
            <button id="collectBtn">리뷰 수집</button>
        </div>

        <div class="button-group">
            <button id="viewAllBtn" class="btn-secondary">전체 보기</button>
            <button id="exportJsonBtn" class="btn-secondary">JSON 내보내기</button>
            <button id="exportCsvBtn" class="btn-secondary">CSV 내보내기</button>
            <button id="clearBtn" class="btn-danger">데이터 삭제</button>
        </div>

        <div class="status" id="status"></div>

        <div class="footer">
            쿠팡 상품 페이지에서 사용하세요
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
